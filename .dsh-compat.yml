schema: 1
watch:
  channel: latest
repair:
  dsh_version: 0.1.1-rc.1
  start_policy: immediate
budget:
  max_tokens: 600000
  max_cny: 3
plugin:
  workspace: packages/dsh-skill-explorer
  package_json: package.json
  profile: web
smoke:
  contract: compatibility/dsh-smoke.yml
gates:
  repository:
    - pnpm --filter @linxin666/dsh-client-ui-skill-explorer test
    - pnpm --filter @linxin666/dsh-client-ui-skill-explorer build
delivery:
  mode: pull-request
